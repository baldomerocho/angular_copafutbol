<p-toast></p-toast>
<app-floating-configurator />

<div class="auth-container">
    <div class="glass-card">
        <div class="text-center mb-6">
            <i class="pi pi-user-plus"></i>
            <h1 class="auth-title">Copa Futbol</h1>
            <p class="auth-subtitle">Crea tu cuenta para empezar</p>
        </div>

        <p-fluid>
            <div class="grid grid-cols-12 gap-x-4 gap-y-3">
                <div class="col-span-12">
                    <label for="name" class="auth-label">Nombre Completo</label>
                    <input pInputText id="name" type="text" placeholder="Tu nombre" [(ngModel)]="name" />
                </div>

                <div class="col-span-12">
                    <label for="email" class="auth-label">Email</label>
                    <input pInputText id="email" type="text" placeholder="Correo electrónico" [(ngModel)]="email" />
                </div>

                <div class="col-span-12 sm:col-span-6">
                    <label for="role" class="auth-label">Perfil</label>
                    <p-select [options]="roles()" [(ngModel)]="selectedRole" optionLabel="label" optionValue="value"
                        placeholder="Perfil"></p-select>
                </div>

                <div class="col-span-12 sm:col-span-6">
                    <label for="password" class="auth-label">Contraseña</label>
                    <p-password id="password" [(ngModel)]="password" placeholder="Tu contraseña" [toggleMask]="true"
                        [feedback]="true" promptLabel="Elige una contraseña" weakLabel="Débil" mediumLabel="Media"
                        strongLabel="Fuerte"></p-password>
                </div>

                <div class="col-span-12 mt-2">
                    <p-button label="Registrarse" (onClick)="onRegister()" [loading]="loading" size="large"></p-button>
                </div>

                <div class="col-span-12 mt-2 text-center text-sm">
                    <span class="text-surface-600 dark:text-surface-400">¿Ya tienes cuenta? </span>
                    <a routerLink="/auth/login" class="font-bold no-underline cursor-pointer text-primary">Inicia
                        sesión</a>
                </div>
            </div>
        </p-fluid>
    </div>
</div>
