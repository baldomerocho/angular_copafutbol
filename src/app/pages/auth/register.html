<p-toast></p-toast>
<app-floating-configurator />
<div
    class="bg-surface-50 dark:bg-surface-950 flex items-center justify-center min-h-screen min-w-screen overflow-hidden">
    <div class="flex flex-col items-center justify-center">
        <div
            style="border-radius: 56px; padding: 0.3rem; background: linear-gradient(180deg, var(--primary-color) 10%, rgba(33, 150, 243, 0) 30%)">
            <div class="w-full bg-surface-0 dark:bg-surface-900 py-20 px-8 sm:px-20" style="border-radius: 53px">
                <div class="text-center mb-8">
                    <i class="pi pi-user-plus text-primary text-5xl mb-4"></i>
                    <div class="text-surface-900 dark:text-surface-0 text-3xl font-medium mb-4">Copa Futbol</div>
                    <span class="text-muted-color font-medium">Crea tu cuenta para empezar</span>
                </div>

                <div>
                    <label for="name" class="block text-surface-900 dark:text-surface-0 text-xl font-medium mb-2">Nombre
                        Completo</label>
                    <input pInputText id="name" type="text" placeholder="Tu nombre" class="w-full mb-4"
                        [(ngModel)]="name" />

                    <label for="email"
                        class="block text-surface-900 dark:text-surface-0 text-xl font-medium mb-2">Email</label>
                    <input pInputText id="email" type="text" placeholder="Correo electrónico" class="w-full mb-4"
                        [(ngModel)]="email" />

                    <label for="role"
                        class="block text-surface-900 dark:text-surface-0 text-xl font-medium mb-2">Perfil</label>
                    <p-select [options]="roles()" [(ngModel)]="selectedRole" optionLabel="name" optionValue="id"
                        class="w-full mb-4" styleClass="w-full" placeholder="Selecciona un perfil"></p-select>

                    <label for="password"
                        class="block text-surface-900 dark:text-surface-0 font-medium text-xl mb-2">Contraseña</label>
                    <p-password id="password" [(ngModel)]="password" placeholder="Contraseña" [toggleMask]="true"
                        styleClass="mb-8" [fluid]="true" [feedback]="true" promptLabel="Elige una contraseña"
                        weakLabel="Débil" mediumLabel="Media" strongLabel="Fuerte"></p-password>

                    <p-button label="Registrarse" styleClass="w-full" (onClick)="onRegister()"
                        [loading]="loading"></p-button>

                    <div class="mt-6 text-center">
                        <span class="text-muted-color">¿Ya tienes cuenta? </span>
                        <a routerLink="/auth/login" class="font-medium no-underline cursor-pointer text-primary">Inicia
                            sesión</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
