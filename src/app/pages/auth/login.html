<p-toast></p-toast>
<app-floating-configurator />

<div class="auth-container">
    <div class="glass-card">
        <div class="text-center mb-6">
            <i class="pi pi-briefcase"></i>
            <h1 class="auth-title">Copa Futbol</h1>
            <p class="auth-subtitle">Inicia sesión para continuar</p>
        </div>

        <p-fluid>
            <div class="flex flex-col gap-6">
                <div class="flex flex-col gap-2">
                    <label for="email" class="auth-label">Email</label>
                    <input pInputText id="email" type="text" placeholder="Correo electrónico" [(ngModel)]="email" />
                </div>

                <div class="flex flex-col gap-2">
                    <label for="password" class="auth-label">Contraseña</label>
                    <p-password id="password" [(ngModel)]="password" placeholder="Contraseña" [toggleMask]="true"
                        [feedback]="false"></p-password>
                </div>

                <div class="flex items-center justify-between mt-2">
                    <div class="flex items-center gap-2">
                        <p-checkbox [(ngModel)]="rememberMe" id="rememberme" binary></p-checkbox>
                        <label for="rememberme" class="cursor-pointer font-medium">Recordarme</label>
                    </div>
                    <a class="font-medium no-underline text-primary cursor-pointer text-sm">¿Olvidaste tu
                        contraseña?</a>
                </div>

                <p-button label="Ingresar" (onClick)="onLogin()" [loading]="loading" size="large"></p-button>

                <div class="mt-4 text-center text-sm">
                    <span class="text-surface-600 dark:text-surface-400">¿No tienes cuenta? </span>
                    <a routerLink="/auth/register" class="font-bold no-underline cursor-pointer text-primary">Regístrate
                        aquí</a>
                </div>
            </div>
        </p-fluid>
    </div>
</div>
