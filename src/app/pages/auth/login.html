<p-toast></p-toast>
<app-floating-configurator />
<div
    class="bg-surface-50 dark:bg-surface-950 flex items-center justify-center min-h-screen min-w-screen overflow-hidden">
    <div class="flex flex-col items-center justify-center">
        <div
            style="border-radius: 56px; padding: 0.3rem; background: linear-gradient(180deg, var(--primary-color) 10%, rgba(33, 150, 243, 0) 30%)">
            <div class="w-full bg-surface-0 dark:bg-surface-900 py-20 px-8 sm:px-20" style="border-radius: 53px">
                <div class="text-center mb-8">
                    <i class="pi pi-briefcase text-primary text-5xl mb-4"></i>
                    <div class="text-surface-900 dark:text-surface-0 text-3xl font-medium mb-4">Copa Futbol</div>
                    <span class="text-muted-color font-medium">Inicia sesión para continuar</span>
                </div>

                <div>
                    <label for="email"
                        class="block text-surface-900 dark:text-surface-0 text-xl font-medium mb-2">Email</label>
                    <input pInputText id="email" type="text" placeholder="Correo electrónico" class="w-full mb-8"
                        [(ngModel)]="email" />

                    <label for="password"
                        class="block text-surface-900 dark:text-surface-0 font-medium text-xl mb-2">Contraseña</label>
                    <p-password id="password" [(ngModel)]="password" placeholder="Contraseña" [toggleMask]="true"
                        styleClass="mb-4" [fluid]="true" [feedback]="false"></p-password>

                    <div class="flex items-center justify-between mt-2 mb-8 gap-8">
                        <div class="flex items-center">
                            <p-checkbox [(ngModel)]="rememberMe" id="rememberme" binary class="mr-2"></p-checkbox>
                            <label for="rememberme">Recordarme</label>
                        </div>
                        <a class="font-medium no-underline ml-2 text-right cursor-pointer text-primary">¿Olvidaste tu
                            contraseña?</a>
                    </div>
                    <p-button label="Ingresar" styleClass="w-full" (onClick)="onLogin()" [loading]="loading"></p-button>

                    <div class="mt-6 text-center">
                        <span class="text-muted-color">¿No tienes cuenta? </span>
                        <a routerLink="/auth/register"
                            class="font-medium no-underline cursor-pointer text-primary">Regístrate aquí</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
