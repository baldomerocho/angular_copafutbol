<p-toast></p-toast>
<div class="card">
    <p-toolbar styleClass="mb-4">
        <ng-template pTemplate="left">
            <button pButton label="Nueva Sede/Campo" icon="pi pi-plus" class="p-button-success mr-2"
                (click)="openNew()"></button>
        </ng-template>
    </p-toolbar>

    <p-table [value]="fields" [rows]="10" [paginator]="true" responsiveLayout="scroll" [loading]="loading">
        <ng-template pTemplate="header">
            <tr>
                <th>Nombre</th>
                <th>Ubicación</th>
                <th>Capacidad</th>
                <th>Acciones</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-field>
            <tr>
                <td>{{field.name}}</td>
                <td>{{field.location}}</td>
                <td>{{field.capacity}}</td>
                <td>
                    <button pButton icon="pi pi-pencil" class="p-button-rounded p-button-success mr-2"
                        (click)="editField(field)"></button>
                    <button pButton icon="pi pi-trash" class="p-button-rounded p-button-warning"
                        (click)="deleteField(field)"></button>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>

<p-confirmdialog [style]="{width: '450px'}"></p-confirmdialog>

<p-dialog [(visible)]="fieldDialog" [style]="{width: '450px'}" header="Detalles de la Sede" [modal]="true">
    <ng-template pTemplate="content">
        <p-fluid>
            <div class="flex flex-col gap-4">
                <div class="flex flex-col gap-2">
                    <label for="name" class="font-bold">Nombre</label>
                    <input type="text" pInputText id="name" [(ngModel)]="field.name" required autofocus />
                </div>
                <div class="flex flex-col gap-2">
                    <label for="location" class="font-bold">Ubicación</label>
                    <input type="text" pInputText id="location" [(ngModel)]="field.location" />
                </div>
                <div class="flex flex-col gap-2">
                    <label for="capacity" class="font-bold">Capacidad</label>
                    <p-inputnumber id="capacity" [(ngModel)]="field.capacity"></p-inputnumber>
                </div>
            </div>
        </p-fluid>
    </ng-template>

    <ng-template pTemplate="footer">
        <p-button label="Cancelar" icon="pi pi-times" [text]="true" (click)="hideDialog()"></p-button>
        <p-button label="Guardar" icon="pi pi-check" (click)="saveField()"></p-button>
    </ng-template>
</p-dialog>
