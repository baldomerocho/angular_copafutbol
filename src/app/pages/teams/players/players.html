<p-toast></p-toast>

<div class="card">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-6">
        <div>
            <h3 class="m-0 font-bold text-2xl">Jugadores: {{ team?.name }}</h3>
            <p class="text-surface-500 mt-1" *ngIf="team?.tournament">Torneo: {{ team?.tournament?.name }}</p>
        </div>
        <p-button label="Volver a Equipos" icon="pi pi-arrow-left" [outlined]="true" routerLink="/pages/teams" />
    </div>

    <p-toolbar styleClass="mb-6">
        <ng-template #start>
            <p-button label="Nuevo Jugador" icon="pi pi-plus" severity="success" class="mr-2" (onClick)="openNew()" />
        </ng-template>

        <ng-template #end>
            <p-iconfield>
                <p-inputicon styleClass="pi pi-search" />
                <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" placeholder="Buscar..." />
            </p-iconfield>
        </ng-template>
    </p-toolbar>

    <p-table #dt [value]="players()" [rows]="10" [paginator]="true" [globalFilterFields]="['name', 'number']"
        [rowHover]="true" dataKey="id"
        currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} jugadores"
        [showCurrentPageReport]="true" [rowsPerPageOptions]="[10, 20, 50]" [loading]="loading">
        <ng-template #header>
            <tr>
                <th pSortableColumn="number" style="width: 8rem">Dorsal <p-sortIcon field="number" /></th>
                <th pSortableColumn="name">Nombre <p-sortIcon field="name" /></th>
                <th style="width: 10rem"></th>
            </tr>
        </ng-template>
        <ng-template #body let-player>
            <tr>
                <td>
                    <span class="font-bold text-xl">#{{ player.number }}</span>
                </td>
                <td>{{ player.name }}</td>
                <td class="text-center">
                    <p-button icon="pi pi-pencil" [rounded]="true" [outlined]="true" severity="success" class="mr-2"
                        (onClick)="editPlayer(player)" />
                    <p-button icon="pi pi-trash" [rounded]="true" [outlined]="true" severity="danger"
                        (onClick)="deletePlayer(player)" />
                </td>
            </tr>
        </ng-template>
        <ng-template #emptymessage>
            <tr>
                <td colspan="3" class="text-center p-4">No se encontraron jugadores para este equipo.</td>
            </tr>
        </ng-template>
    </p-table>
</div>

<p-dialog [(visible)]="playerDialog" [style]="{ width: '400px' }"
    [header]="player.id ? 'Editar Jugador' : 'Nuevo Jugador'" [modal]="true">
    <ng-template #content>
        <p-fluid>
            <div class="flex flex-col gap-4">
                <div>
                    <label for="name" class="block font-bold mb-2">Nombre</label>
                    <input type="text" pInputText id="name" [(ngModel)]="player.name" required autofocus />
                    <small class="text-red-500" *ngIf="submitted && !player.name">El nombre es requerido.</small>
                </div>
                <div>
                    <label for="number" class="block font-bold mb-2">Número / Dorsal</label>
                    <p-inputnumber id="number" [(ngModel)]="player.number" placeholder="Ej: 10" [min]="1" [max]="99" />
                    <small class="text-red-500" *ngIf="submitted && player.number === undefined">El número es
                        requerido.</small>
                </div>
            </div>
        </p-fluid>
    </ng-template>

    <ng-template #footer>
        <p-button label="Cancelar" icon="pi pi-times" [text]="true" (onClick)="hideDialog()" />
        <p-button label="Guardar" icon="pi pi-check" (onClick)="savePlayer()" />
    </ng-template>
</p-dialog>

<p-confirmdialog [style]="{ width: '450px' }" acceptLabel="Sí" rejectLabel="No" />
