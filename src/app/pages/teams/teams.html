<p-toast></p-toast>

<div class="card">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-6">
        <h3 class="m-0 font-bold text-2xl">Gestión de Equipos</h3>
    </div>

    <p-toolbar styleClass="mb-6">
        <ng-template #start>
            <p-button label="Nuevo Equipo" icon="pi pi-plus" severity="success" class="mr-2"
                routerLink="/pages/teams/new" />
        </ng-template>
    </p-toolbar>

    <p-table [value]="teams()" [rows]="10" [paginator]="true" responsiveLayout="scroll" [loading]="loading"
        [rowHover]="true" dataKey="id" currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} equipos"
        [showCurrentPageReport]="true" [rowsPerPageOptions]="[10, 20, 50]">
        <ng-template #header>
            <tr>
                <th pSortableColumn="name">Nombre <p-sortIcon field="name" /></th>
                <th pSortableColumn="tournament.name">Torneo <p-sortIcon field="tournament.name" /></th>
                <th pSortableColumn="manager.name">Entrenador <p-sortIcon field="manager.name" /></th>
                <th style="width: 15rem">Acciones</th>
            </tr>
        </ng-template>
        <ng-template #body let-team>
            <tr>
                <td>
                    <span class="font-bold">{{ team.name }}</span>
                </td>
                <td>{{ team.tournament?.name || 'N/A' }}</td>
                <td>{{ team.manager?.name || 'Unassigned' }}</td>
                <td class="text-center">
                    <p-button icon="pi pi-users" [rounded]="true" [outlined]="true" severity="info" class="mr-2"
                        pTooltip="Gestionar Jugadores" tooltipPosition="top"
                        [routerLink]="['/pages/teams', team.id, 'players']" />
                    <p-button icon="pi pi-pencil" [rounded]="true" [outlined]="true" severity="success" class="mr-2"
                        pTooltip="Editar Equipo" tooltipPosition="top" [routerLink]="['/pages/teams/edit', team.id]" />
                    <p-button icon="pi pi-trash" [rounded]="true" [outlined]="true" severity="danger"
                        pTooltip="Eliminar Equipo" tooltipPosition="top" (onClick)="deleteTeam(team)" />
                </td>
            </tr>
        </ng-template>
        <ng-template #emptymessage>
            <tr>
                <td colspan="4" class="text-center p-4">No hay equipos registrados.</td>
            </tr>
        </ng-template>
    </p-table>
</div>

<p-confirmdialog [style]="{ width: '450px' }" acceptLabel="Sí" rejectLabel="No" />
