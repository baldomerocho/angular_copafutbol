<p-toast></p-toast>
<div class="card">
    <p-toolbar styleClass="mb-4">
        <ng-template pTemplate="left">
            <button pButton label="Nuevo Equipo" icon="pi pi-plus" class="p-button-success mr-2"
                (click)="openNew()"></button>
        </ng-template>
    </p-toolbar>

    <p-table [value]="teams" [rows]="10" [paginator]="true" responsiveLayout="scroll" [loading]="loading">
        <ng-template pTemplate="header">
            <tr>
                <th>Nombre</th>
                <th>Torneo</th>
                <th>Entrenador</th>
                <th>Acciones</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-team>
            <tr>
                <td>{{team.name}}</td>
                <td>{{team.tournament?.name}}</td>
                <td>{{team.manager?.name}}</td>
                <td>
                    <button pButton icon="pi pi-pencil" class="p-button-rounded p-button-success mr-2"
                        (click)="editTeam(team)"></button>
                    <button pButton icon="pi pi-trash" class="p-button-rounded p-button-warning"
                        (click)="deleteTeam(team)"></button>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>

<p-confirmdialog [style]="{width: '450px'}"></p-confirmdialog>

<p-dialog [(visible)]="teamDialog" [style]="{width: '450px'}" header="Detalles del Equipo" [modal]="true">
    <ng-template pTemplate="content">
        <p-fluid>
            <div class="flex flex-col gap-4">
                <div class="flex flex-col gap-2">
                    <label for="name" class="font-bold">Nombre</label>
                    <input type="text" pInputText id="name" [(ngModel)]="team.name" required autofocus />
                </div>
                <div *ngIf="prefix === 'admin' || prefix === 'staff'" class="flex flex-col gap-2">
                    <label for="tournament_id" class="font-bold">Torneo</label>
                    <p-select [options]="tournaments" optionLabel="name" optionValue="id"
                        [(ngModel)]="team.tournament_id" placeholder="Seleccione un torneo" [appendTo]="'body'"
                        [loading]="loadingExtra" />
                </div>
                <div *ngIf="prefix === 'admin' || prefix === 'staff'" class="flex flex-col gap-2">
                    <label for="manager_id" class="font-bold">Entrenador</label>
                    <p-select [options]="managers" optionLabel="name" optionValue="id" [(ngModel)]="team.manager_id"
                        placeholder="Seleccione un entrenador" [appendTo]="'body'" [loading]="loadingExtra" />
                </div>
            </div>
            <div *ngIf="prefix === 'admin' || prefix === 'staff'" class="flex flex-col gap-2">
                <label for="players" class="font-bold">Jugadores</label>
                <p-select [options]="players" optionLabel="name" optionValue="id" [(ngModel)]="team.players"
                    placeholder="Seleccione jugadores" [appendTo]="'body'" [loading]="loadingExtra" />
            </div>
        </p-fluid>
    </ng-template>

    <ng-template pTemplate="footer">
        <p-button label="Cancelar" icon="pi pi-times" [text]="true" (click)="hideDialog()"></p-button>
        <p-button label="Guardar" icon="pi pi-check" (click)="saveTeam()"></p-button>
    </ng-template>
</p-dialog>
