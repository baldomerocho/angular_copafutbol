<p-toast></p-toast>
<div class="card">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-6 gap-4">
        <div class="text-surface-900 dark:text-surface-0 text-3xl font-semibold">{{ isEdit ? 'Editar Torneo' : 'Nuevo
            Torneo' }}</div>
        <p-button label="Volver" icon="pi pi-arrow-left" [text]="true" routerLink="/pages/tournaments"></p-button>
    </div>

    <p-fluid>
        <div class="grid grid-cols-12 gap-6">
            <div class="col-span-12 md:col-span-6 flex flex-col gap-2">
                <label for="name" class="font-bold">Nombre *</label>
                <input type="text" pInputText id="name" [(ngModel)]="tournament.name"
                    placeholder="Ej. Torneo de Verano" />
            </div>

            <div class="col-span-12 md:col-span-6 flex flex-col gap-2">
                <label for="location" class="font-bold">Ubicación</label>
                <input type="text" pInputText id="location" [(ngModel)]="tournament.location"
                    placeholder="Ej. Ciudad Deportiva" />
            </div>

            <div class="col-span-12 flex flex-col gap-2">
                <label for="description" class="font-bold">Descripción</label>
                <textarea pTextarea id="description" [(ngModel)]="tournament.description" rows="3"
                    style="resize: none"></textarea>
            </div>

            <div class="col-span-12 md:col-span-3 flex flex-col gap-2">
                <label for="start_date" class="font-bold">Fecha Inicio</label>
                <p-datepicker [(ngModel)]="tournament.start_date" inputId="start_date" appendTo="body"
                    dateFormat="yy-mm-dd"></p-datepicker>
            </div>

            <div class="col-span-12 md:col-span-3 flex flex-col gap-2">
                <label for="end_date" class="font-bold">Fecha Fin</label>
                <p-datepicker [(ngModel)]="tournament.end_date" inputId="end_date" appendTo="body"
                    dateFormat="yy-mm-dd"></p-datepicker>
            </div>

            <div class="col-span-12 md:col-span-3 flex flex-col gap-2">
                <label for="max_teams" class="font-bold">Máximo de Equipos</label>
                <p-inputnumber [(ngModel)]="tournament.max_teams" inputId="max_teams" [showButtons]="true"
                    [min]="2"></p-inputnumber>
            </div>

            <div class="col-span-12 md:col-span-3 flex flex-col gap-2">
                <label for="price" class="font-bold">Precio Inscripción</label>
                <p-inputnumber [(ngModel)]="tournament.enrollment_price" inputId="price" mode="currency" currency="USD"
                    locale="en-US"></p-inputnumber>
            </div>

            <div class="col-span-12 md:col-span-6 flex flex-col gap-2" *ngIf="isEdit">
                <label class="font-bold">Estado</label>
                <p-select [options]="statuses()" [(ngModel)]="tournament.status" optionLabel="name" optionValue="id"
                    placeholder="Seleccione un estado"></p-select>
            </div>

            <!-- Extra Prices Section -->
            <div class="col-span-12 mt-4">
                <div class="flex items-center justify-between mb-4">
                    <span class="text-xl font-bold">Cobros Extras</span>
                    <p-button icon="pi pi-plus" label="Agregar Cobro" [outlined]="true" size="small"
                        (click)="addExtraPrice()"></p-button>
                </div>

                <div *ngIf="!tournament.extra_prices || tournament.extra_prices.length === 0"
                    class="text-center p-8 border border-surface-200 dark:border-surface-700 rounded-lg bg-surface-50 dark:bg-surface-900 text-muted-color">
                    No hay cobros extras definidos.
                </div>

                <div *ngFor="let extra of tournament.extra_prices; let i = index"
                    class="grid grid-cols-12 gap-4 mb-4 items-end">
                    <div class="col-span-12 md:col-span-6 flex flex-col gap-2">
                        <label [for]="'extra_name_' + i" class="font-medium text-sm">Nombre del Cobro</label>
                        <input type="text" pInputText [id]="'extra_name_' + i" [(ngModel)]="extra.name"
                            placeholder="Ej. Arbitraje, Uniforme..." />
                    </div>
                    <div class="col-span-10 md:col-span-5 flex flex-col gap-2">
                        <label [for]="'extra_amount_' + i" class="font-medium text-sm">Monto</label>
                        <p-inputnumber [inputId]="'extra_amount_' + i" [(ngModel)]="extra.amount" mode="currency"
                            currency="USD" locale="en-US"></p-inputnumber>
                    </div>
                    <div class="col-span-2 md:col-span-1 flex justify-end">
                        <p-button icon="pi pi-trash" [outlined]="true" severity="danger"
                            (click)="removeExtraPrice(i)"></p-button>
                    </div>
                </div>
            </div>
        </div>
    </p-fluid>

    <div class="flex justify-end mt-8 border-t border-surface-200 dark:border-surface-700 pt-6">
        <p-button label="Guardar Torneo" icon="pi pi-check" severity="primary" class="w-full md:w-auto"
            [loading]="loading" (click)="saveTournament()"></p-button>
    </div>
</div>
