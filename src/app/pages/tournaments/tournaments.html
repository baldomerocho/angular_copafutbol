<p-toast></p-toast>
<div class="card">
    <p-toolbar styleClass="mb-4">
        <ng-template pTemplate="left">
            <button pButton label="Nuevo Torneo" icon="pi pi-plus" class="p-button-success mr-2"
                (click)="openNew()"></button>
        </ng-template>
    </p-toolbar>

    <p-table [value]="tournaments" [rows]="10" [paginator]="true" responsiveLayout="scroll" [loading]="loading">
        <ng-template pTemplate="header">
            <tr>
                <th>Nombre</th>
                <th>Ubicación</th>
                <th>Precio</th>
                <th>Estado</th>
                <th style="width: 10rem">Acciones</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-tournament>
            <tr>
                <td>{{tournament.name}}</td>
                <td>{{tournament.location}}</td>
                <td>{{tournament.enrollment_price | currency:'USD'}}</td>
                <td>{{getStatusName(tournament.status)}}</td>
                <td>
                    <button pButton icon="pi pi-pencil" class="p-button-rounded p-button-success mr-2"
                        (click)="editTournament(tournament)"></button>
                    <button pButton icon="pi pi-trash" class="p-button-rounded p-button-warning"
                        (click)="deleteTournament(tournament)"></button>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>

<p-confirmdialog [style]="{width: '450px'}"></p-confirmdialog>
