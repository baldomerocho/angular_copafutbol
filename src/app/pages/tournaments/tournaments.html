<p-toast></p-toast>
<div class="card">
    <p-toolbar styleClass="mb-4">
        <ng-template pTemplate="left">
            <button pButton label="Nuevo Torneo" icon="pi pi-plus" class="p-button-success mr-2"
                (click)="openNew()"></button>
        </ng-template>
    </p-toolbar>

    <p-table [value]="tournaments" [rows]="10" [paginator]="true" responsiveLayout="scroll" [loading]="loading">
        <ng-template pTemplate="header">
            <tr>
                <th>Nombre</th>
                <th>Ubicación</th>
                <th>Precio</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-tournament>
            <tr>
                <td>{{tournament.name}}</td>
                <td>{{tournament.location}}</td>
                <td>{{tournament.enrollment_price | currency:'USD'}}</td>
                <td>{{getStatusName(tournament.status)}}</td>
                <td>
                    <button pButton icon="pi pi-pencil" class="p-button-rounded p-button-success mr-2"
                        (click)="editTournament(tournament)"></button>
                    <button pButton icon="pi pi-trash" class="p-button-rounded p-button-warning"
                        (click)="deleteTournament(tournament)"></button>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>

<p-confirmdialog [style]="{width: '450px'}"></p-confirmdialog>

<p-dialog [(visible)]="tournamentDialog" [style]="{width: '450px'}" header="Detalles del Torneo" [modal]="true"
    class="p-fluid">
    <ng-template pTemplate="content">
        <div class="field">
            <label for="name">Nombre</label>
            <input type="text" pInputText id="name" [(ngModel)]="tournament.name" required autofocus />
        </div>
        <div class="field">
            <label for="description">Descripción</label>
            <input type="text" pInputText id="description" [(ngModel)]="tournament.description" />
        </div>
        <div class="field">
            <label for="location">Ubicación</label>
            <input type="text" pInputText id="location" [(ngModel)]="tournament.location" />
        </div>
        <div class="grid">
            <div class="col-6 field">
                <label for="price">Precio Inscripción</label>
                <input type="number" pInputText id="price" [(ngModel)]="tournament.enrollment_price" />
            </div>
            <div class="col-6 field">
                <label>Tipo</label>
                <p-select [options]="types()" [(ngModel)]="tournament.status" optionLabel="name" optionValue="id"
                    placeholder="Tipo" appendTo="body"></p-select>
            </div>
        </div>
        <div class="field" *ngIf="tournament.id">
            <label>Estado</label>
            <p-select [options]="statuses()" [(ngModel)]="tournament.status" optionLabel="name" optionValue="id"
                placeholder="Estado" appendTo="body"></p-select>
        </div>
    </ng-template>

    <ng-template pTemplate="footer">
        <button pButton label="Cancelar" icon="pi pi-times" class="p-button-text" (click)="hideDialog()"></button>
        <button pButton label="Guardar" icon="pi pi-check" class="p-button-text" (click)="saveTournament()"></button>
    </ng-template>
</p-dialog>
