<p-toast></p-toast>

<div class="card">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-6">
        <h3 class="m-0 font-bold text-2xl">{{ title }}</h3>
    </div>

    <p-toolbar styleClass="mb-6">
        <ng-template #start>
            <p-button label="Nuevo Usuario" icon="pi pi-plus" severity="success" class="mr-2" (onClick)="openNew()" />
        </ng-template>

        <ng-template #end>
            <p-iconfield>
                <p-inputicon styleClass="pi pi-search" />
                <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" placeholder="Buscar..." />
            </p-iconfield>
        </ng-template>
    </p-toolbar>

    <p-table #dt [value]="users()" [rows]="10" [paginator]="true" [globalFilterFields]="['name', 'email', 'role']"
        [rowHover]="true" dataKey="id" currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} usuarios"
        [showCurrentPageReport]="true" [rowsPerPageOptions]="[10, 20, 50]" [loading]="loading">
        <ng-template #header>
            <tr>
                <th pSortableColumn="id" style="width: 5rem">ID <p-sortIcon field="id" /></th>
                <th pSortableColumn="name">Nombre <p-sortIcon field="name" /></th>
                <th pSortableColumn="email">Email <p-sortIcon field="email" /></th>
                <th pSortableColumn="role" style="min-width: 8rem">Rol <p-sortIcon field="role" /></th>
                <th style="width: 10rem"></th>
            </tr>
        </ng-template>
        <ng-template #body let-user>
            <tr>
                <td>{{ user.id }}</td>
                <td>{{ user.name }}</td>
                <td>{{ user.email }}</td>
                <td>
                    <p-tag [value]="getRoleLabel(user.role)" [severity]="getRoleSeverity(user.role)" />
                </td>
                <td class="text-center">
                    <p-button icon="pi pi-pencil" [rounded]="true" [outlined]="true" severity="success" class="mr-2"
                        (onClick)="editUser(user)" />
                    <p-button icon="pi pi-trash" [rounded]="true" [outlined]="true" severity="danger"
                        (onClick)="deleteUser(user)" />
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>

<p-dialog [(visible)]="userDialog" [style]="{ width: '450px' }" [header]="user.id ? 'Editar Usuario' : 'Nuevo Usuario'"
    [modal]="true">
    <ng-template #content>
        <p-fluid>
            <div class="flex flex-col gap-4">
                <div>
                    <label for="name" class="block font-bold mb-2">Nombre</label>
                    <input type="text" pInputText id="name" [(ngModel)]="user.name" required autofocus />
                    <small class="text-red-500" *ngIf="submitted && !user.name">El nombre es requerido.</small>
                </div>
                <div>
                    <label for="email" class="block font-bold mb-2">Email</label>
                    <input type="email" pInputText id="email" [(ngModel)]="user.email" required />
                    <small class="text-red-500" *ngIf="submitted && !user.email">El email es requerido.</small>
                </div>
                <div *ngIf="!user.id">
                    <label for="password" class="block font-bold mb-2">Contraseña</label>
                    <input type="password" pInputText id="password" [(ngModel)]="user.password" required />
                    <small class="text-red-500" *ngIf="submitted && !user.password">La contraseña es requerida.</small>
                </div>
                <div *ngIf="user.id">
                    <label for="password" class="block font-bold mb-2">Nueva Contraseña (Opcional)</label>
                    <input type="password" pInputText id="password" [(ngModel)]="user.password"
                        placeholder="Dejar en blanco para no cambiar" />
                </div>
                <div *ngIf="prefix === 'admin'">
                    <label for="role" class="block font-bold mb-2">Rol</label>
                    <p-select id="role" [options]="roles()" [(ngModel)]="user.role" optionLabel="label"
                        optionValue="value" placeholder="Seleccione un rol" />
                    <small class="text-red-500" *ngIf="submitted && !user.role">El rol es requerido.</small>
                </div>
            </div>
        </p-fluid>
    </ng-template>

    <ng-template #footer>
        <p-button label="Cancelar" icon="pi pi-times" [text]="true" (onClick)="hideDialog()" />
        <p-button label="Guardar" icon="pi pi-check" (onClick)="saveUser()" />
    </ng-template>
</p-dialog>

<p-confirmdialog [style]="{ width: '450px' }" acceptLabel="Sí" rejectLabel="No" />
